name: Юнит-тесты

# Модель запуска (триггеры, забор кода PR, гейт для форков) описана в
# .github/workflows/README.md - она общая для всех тестовых workflow.

on:
  push:
    branches:
      - develop
      - master
      - 'release/**'
  pull_request_target:
  workflow_dispatch:

concurrency:
  # event входит в ключ намеренно: у PR, открытых до перехода на pull_request_target,
  # в ветке лежит старая версия этого workflow с триггером pull_request, а её прогон
  # читается из ветки PR. Без event в группе он попадал бы в ту же группу и отменял
  # наш прогон по pull_request_target.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # PR из форка выполняет чужой код в доверенном контексте (pull_request_target = секреты
  # базового репозитория), а встроенный гейт GitHub на pull_request_target не действует.
  # Поэтому прогон подтверждает мейнтейнер через environment pr-from-fork.
  # Для push и PR из веток самого репозитория джоба пропускается.
  gate:
    name: Допуск прогона кода из форка
    if: github.event.pull_request.head.repo.fork
    runs-on: ubuntu-22.04
    environment: pr-from-fork
    steps:
      - name: Подтверждение получено
        run: echo "Мейнтейнер подтвердил прогон кода из форка"

  unit-test:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        oscript_version: ['stable', 'default']
        os: ['windows-latest', 'ubuntu-22.04']
    steps:
      - name: Актуализация
        uses: actions/checkout@v4
        with:
          # pull_request_target выполняется в контексте базовой ветки, поэтому код PR
          # забираем явно - merge-ref'ом, то есть тем, что реально попадёт в базовую ветку.
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          # Осознанный опт-ин на выполнение кода форка в доверенном контексте.
          # Прикрыт гейтом pr-from-fork выше. Вход появился в actions/checkout 4.4.0,
          # на которую сейчас указывает тег v4.
          allow-unsafe-pr-checkout: true

      - name: Установка свойств git
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Вычисление версии OneScript
        shell: bash
        id: extract_oscript_version
        run: |
          set -ex
          if [ "${{ matrix.oscript_version }}" = "default" ]
          then
            extracted_version=$(cat packagedef | grep ".ВерсияСреды(" | sed 's|[^"]*"||' | sed -r 's/".+//' || true)
            version="${extracted_version:-stable}"
          else
            version="${{ matrix.oscript_version }}"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Установка OneScript
        uses: otymko/setup-onescript@v1.4
        with:
          version: ${{ steps.extract_oscript_version.outputs.version }}

      - name: Установка зависимостей
        run: |
          opm install opm
          opm install -l --dev

      - name: Установка дополнительных пакетов
        run: |
          opm install --dev
          opm i add
          opm install moskito

      - name: Запуск юнит-тестов
        run: oscript ./tasks/test_unit.os

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'build/reports/junit-unit.xml'
          fail_on_failure: true
          require_passed_tests: true
          comment: true
          updateComment: true
          detailed_summary: true
          group_suite: true
          include_time_in_summary: true
          flaky_summary: true
          simplified_summary: true
          skip_success_summary: true
          check_title_template: '{{SUITE_NAME}} / {{TEST_NAME}}'
          job_summary_text: |
            **ОС:** ${{ matrix.os }} · **OneScript:** ${{ steps.extract_oscript_version.outputs.version }}
          check_name: 'Юнит-тесты. ОС: ${{ matrix.os }}. Версия OneScript: ${{ steps.extract_oscript_version.outputs.version }}'
