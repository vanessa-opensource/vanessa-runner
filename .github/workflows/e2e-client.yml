name: E2E тесты (клиент)

# Файловые/клиентские E2E-сценарии (tests/e2e/client-tests).
# Не требуют серверной инфраструктуры - только клиентскую платформу 1С.
# Прогоняются на матрице ОС × версий платформы × версий OneScript.
#
# Модель запуска (триггеры, забор кода PR, гейт для форков) описана в
# .github/workflows/README.md - она общая для всех тестовых workflow.

on:
  push:
    branches:
      - develop
      - master
      - 'release/**'
  pull_request_target:
  workflow_dispatch:

concurrency:
  # event входит в ключ намеренно: у PR, открытых до перехода на pull_request_target,
  # в ветке лежит старая версия этого workflow с триггером pull_request, а её прогон
  # читается из ветки PR. Без event в группе он попадал бы в ту же группу и отменял
  # наш прогон по pull_request_target.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  client-test:
    name: E2E (клиент)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        oscript_version: ['stable']
        v8_version: ['8.3.25.1445', '8.5.1.1302']
        os: ['windows-latest', 'ubuntu-22.04']
        locale: ['ru_RU']
    steps:
      - name: Set Russian locale
        if: matrix.os == 'windows-latest'
        run: |
          powershell -Command "Set-WinUILanguageOverride -Language ru-RU"
          powershell -Command "Set-WinUserLanguageList ru-RU -Force"
          powershell -Command "Set-Culture ru-RU"
          powershell -Command "Set-WinSystemLocale ru-RU"

      - name: Verify locale settings
        if: matrix.os == 'windows-latest'
        run: |
          powershell -Command "Get-WinUILanguageOverride"
          powershell -Command "Get-WinUserLanguageList"
          powershell -Command "Get-Culture"
          powershell -Command "Get-WinSystemLocale"

      - name: Актуализация
        uses: actions/checkout@v4
        with:
          # pull_request_target выполняется в контексте базовой ветки, поэтому код PR
          # забираем явно - merge-ref'ом, то есть тем, что реально попадёт в базовую ветку.
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          # Осознанный опт-ин: без него checkout откажется брать код форка под
          # pull_request_target. Вход появился в actions/checkout 4.4.0, на которую
          # сейчас указывает тег v4.
          allow-unsafe-pr-checkout: true

      - name: Установка свойств git
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Вычисление версии OneScript
        shell: bash
        id: extract_oscript_version
        run: |
          set -ex
          if [ "${{ matrix.oscript_version }}" = "default" ]
          then
            extracted_version=$(cat packagedef | grep ".ВерсияСреды(" | sed 's|[^"]*"||' | sed -r 's/".+//' || true)
            version="${extracted_version:-stable}"
          else
            version="${{ matrix.oscript_version }}"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Установка OneScript
        uses: otymko/setup-onescript@v1.4
        with:
          version: ${{ steps.extract_oscript_version.outputs.version }}

      - name: Установка зависимостей
        run: |
          opm install opm
          opm install -l --dev

      - name: Установка дополнительных пакетов
        run: |
          opm install --dev
          opm i add

      - name: Установка 1С:Предприятие
        if: matrix.v8_version != ''
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: ${{ matrix.v8_version }}
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}

      - name: Подготовка окружения (Linux)
        if: matrix.v8_version != '' && matrix.os == 'ubuntu-22.04'
        run: |
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y locales libwebkit2gtk-4.0-37 libglu1-mesa
            sudo ln -s /usr/lib/x86_64-linux-gnu/libenchant-2.so.2 /usr/lib/libenchant.so.1
            sudo localedef -i ${{ matrix.locale }} -c -f UTF-8 -A /usr/share/locale/locale.alias ${{ matrix.locale }}.UTF-8
            echo "LANG=${{ matrix.locale }}.UTF-8" >> $GITHUB_ENV
            echo "LC_ALL=${{ matrix.locale }}.UTF-8" >> $GITHUB_ENV

      - name: Установка лицензии (Linux)
        if: matrix.v8_version != '' && matrix.os == 'ubuntu-22.04'
        run: |
          sudo mkdir -p /var/1C/licenses
          echo "${{ secrets.ONEC_LICENCE }}" | sudo tee /var/1C/licenses/licence.lic > /dev/null
          sudo chmod 777 -R /var/1C/licenses
        shell: bash
        env:
          ONEC_LICENCE: ${{ secrets.ONEC_LICENCE }}

      - name: Создание файла конфигурации conf.cfg (Linux)
        if: matrix.v8_version != '' && matrix.os == 'ubuntu-22.04'
        run: |
              sudo mkdir -p /opt/1cv8/conf/
              sudo tee /opt/1cv8/conf/conf.cfg > /dev/null <<EOF
              DisableUnsafeActionProtection=.*
              SystemLanguage=System
              EOF
              sudo chmod 777 -R /opt/1cv8/conf/

      - name: Установка лицензии (Windows)
        if: matrix.v8_version != '' && matrix.os == 'windows-latest'
        run: |
            mkdir "C:\ProgramData\1C\licenses" -Force
            echo $Env:ONEC_LICENCE | Out-File -FilePath "C:\ProgramData\1C\licenses\licence.lic" -Encoding ascii
        shell: pwsh
        env:
            ONEC_LICENCE: ${{ secrets.ONEC_LICENCE }}

      - name: Создание файла конфигурации conf.cfg (Windows)
        if: matrix.v8_version != '' && matrix.os == 'windows-latest'
        run: |
              New-Item -ItemType Directory -Force -Path "C:\Program Files\1cv8\conf"
              Set-Content -Path "C:\Program Files\1cv8\conf\conf.cfg" -Value @'
              DisableUnsafeActionProtection=.*
              SystemLanguage=System
              '@
        shell: pwsh

      - name: Тестирование клиентских сценариев
        uses: coactions/setup-xvfb@v1
        # НЕ continue-on-error: при параллельном прогоне упавший воркер может не успеть
        # записать junit (падает на старте), и Publish тогда не увидит провала -> ложно-зелёная
        # джоба. Поэтому код возврата раннера (ненулевой при любом упавшем наборе) должен валить
        # шаг напрямую. Publish ниже (if: always) остаётся для аннотаций/отчёта.
        with:
          # Параллельный прогон: клиент 1С уже установлен, тест-файлы гоняются пулом
          # процессов oneunit (по файлу). 8 воркеров для начала.
          run: oscript ./tasks/test_e2e_parallel.os 4

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'build/reports/junit-*.xml'
          fail_on_failure: true
          require_passed_tests: true
          comment: true
          updateComment: true
          detailed_summary: true
          group_suite: true
          include_time_in_summary: true
          flaky_summary: true
          simplified_summary: true
          skip_success_summary: true
          check_title_template: '{{SUITE_NAME}} / {{TEST_NAME}}'
          job_summary_text: |
            **ОС:** ${{ matrix.os }} · **1С:** ${{ matrix.v8_version }} · **OneScript:** ${{ steps.extract_oscript_version.outputs.version }}
          check_name: 'E2E (клиент). ОС: ${{ matrix.os }}. Версия 1С: ${{ matrix.v8_version }}. Версия OneScript: ${{ steps.extract_oscript_version.outputs.version }}'
