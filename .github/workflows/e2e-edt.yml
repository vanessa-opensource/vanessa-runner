name: E2E тесты (EDT)

# EDT-блок e2e-тестов (tests/e2e/edt-tests): команды cf/cfe с --src-format edt,
# автоопределение формата и validate edt. Тестам нужна установленная 1С:EDT (1cedtcli),
# а cf/cfe-сценариям - ещё и платформа 1С:Предприятие.
#
# 1С:EDT ставится тем же действием 1CDevFlow/onec-setup-action (type: edt), что и платформа
# (по образцу bia-technologies/yaxunit). Раннер - windows: наш СервисEDT ищет 1cedtcli через
# edtfind в C:\Program Files\1C\1CE\components (куда action и устанавливает EDT на Windows),
# а имя бинаря у нас 1cedtcli.exe.
#
# Запускается вручную (workflow_dispatch) и по push/PR, затрагивающим EDT-код, тесты,
# фикстуры или сам workflow (полная установка EDT+платформы тяжёлая, поэтому не на каждый push).
#
# Модель запуска (триггеры, забор кода PR, гейт для форков) описана в
# .github/workflows/README.md - она общая для всех тестовых workflow.

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'Версия платформы 1С:Предприятие'
        required: false
        default: '8.3.25.1445'
      edt_version:
        description: 'Версия 1С:EDT'
        required: false
        default: '2025.2.6'
  push:
    branches:
      - develop
      - master
      - 'release/**'
    paths:
      - '.github/workflows/e2e-edt.yml'
      - 'tests/e2e/edt-tests/**'
      - 'tests/e2e/fixtures/edt/**'
      - 'tests/e2e/fixtures/cfe2/**'
      - 'tasks/test_e2e_edt.os'
      - 'src/core/Сервисы/Классы/СервисEDT.os'
      - 'src/core/Сервисы/Классы/СервисРасширений.os'
      - 'src/core/Файлы/**'
      - 'src/cli/Infobase_Подкоманды/**'
      - 'src/cli/Validate_Подкоманды/**'
      - 'src/cli/Cf_Подкоманды/ПодкомандаCfConvert.os'
      - 'src/cli/Cfe_Подкоманды/ПодкомандаCfeConvert.os'
      - 'src/cli/Cfe_Подкоманды/ПодкомандаCfeDecompile.os'
      - 'src/cli/НаборыОпций/НаборОпцийИсходников.os'
  pull_request_target:
    paths:
      - '.github/workflows/e2e-edt.yml'
      - 'tests/e2e/edt-tests/**'
      - 'tests/e2e/fixtures/edt/**'
      - 'tests/e2e/fixtures/cfe2/**'
      - 'tasks/test_e2e_edt.os'
      - 'src/core/Сервисы/Классы/СервисEDT.os'
      - 'src/core/Сервисы/Классы/СервисРасширений.os'
      - 'src/core/Файлы/**'
      - 'src/cli/Infobase_Подкоманды/**'
      - 'src/cli/Validate_Подкоманды/**'
      - 'src/cli/Cf_Подкоманды/ПодкомандаCfConvert.os'
      - 'src/cli/Cfe_Подкоманды/ПодкомандаCfeConvert.os'
      - 'src/cli/Cfe_Подкоманды/ПодкомандаCfeDecompile.os'
      - 'src/cli/НаборыОпций/НаборОпцийИсходников.os'

concurrency:
  # event входит в ключ намеренно: у PR, открытых до перехода на pull_request_target,
  # в ветке лежит старая версия этого workflow с триггером pull_request, а её прогон
  # читается из ветки PR. Без event в группе он попадал бы в ту же группу и отменял
  # наш прогон по pull_request_target.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  edt-test:
    name: E2E (EDT)
    runs-on: windows-latest
    env:
      V8_VERSION: ${{ github.event.inputs.v8_version || '8.3.25.1445' }}
      EDT_VERSION: ${{ github.event.inputs.edt_version || '2025.2.6' }}
    steps:
      - name: Set Russian locale
        run: |
          powershell -Command "Set-WinUILanguageOverride -Language ru-RU"
          powershell -Command "Set-WinUserLanguageList ru-RU -Force"
          powershell -Command "Set-Culture ru-RU"
          powershell -Command "Set-WinSystemLocale ru-RU"

      - name: Актуализация
        uses: actions/checkout@v4
        with:
          # pull_request_target выполняется в контексте базовой ветки, поэтому код PR
          # забираем явно - merge-ref'ом, то есть тем, что реально попадёт в базовую ветку.
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          # Осознанный опт-ин: без него checkout откажется брать код форка под
          # pull_request_target. Вход появился в actions/checkout 4.4.0, на которую
          # сейчас указывает тег v4.
          allow-unsafe-pr-checkout: true

      - name: Установка свойств git
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Установка OneScript
        uses: otymko/setup-onescript@v1.4
        with:
          version: stable

      - name: Установка зависимостей
        run: |
          opm install opm
          opm install -l --dev

      - name: Установка дополнительных пакетов
        run: |
          opm install --dev
          opm i add

      - name: Установка 1С:Предприятие
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: ${{ env.V8_VERSION }}
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}

      - name: Установка 1С:EDT
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: edt
          edt_version: ${{ env.EDT_VERSION }}
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 40

      - name: Установка лицензии (Windows)
        run: |
          mkdir "C:\ProgramData\1C\licenses" -Force
          echo $Env:ONEC_LICENCE | Out-File -FilePath "C:\ProgramData\1C\licenses\licence.lic" -Encoding ascii
        shell: pwsh
        env:
          ONEC_LICENCE: ${{ secrets.ONEC_LICENCE }}

      - name: Создание файла конфигурации conf.cfg (Windows)
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Program Files\1cv8\conf"
          Set-Content -Path "C:\Program Files\1cv8\conf\conf.cfg" -Value @'
          DisableUnsafeActionProtection=.*
          SystemLanguage=System
          '@
        shell: pwsh

      - name: Прогон EDT-блока
        run: oscript ./tasks/test_e2e_edt.os

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'build/reports/junit-edt.xml'
          fail_on_failure: true
          require_passed_tests: true
          detailed_summary: true
          group_suite: true
          include_time_in_summary: true
          check_title_template: '{{SUITE_NAME}} / {{TEST_NAME}}'
          job_summary_text: |
            **ОС:** windows-latest · **1С:** ${{ env.V8_VERSION }} · **1С:EDT:** ${{ env.EDT_VERSION }}
          check_name: 'E2E (EDT). ОС: windows-latest. Версия 1С: ${{ env.V8_VERSION }}. Версия 1С:EDT: ${{ env.EDT_VERSION }}'
